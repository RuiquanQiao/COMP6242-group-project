<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Experimental workflow for the transfer learning study</title>
  <desc id="desc">A compact two-lane workflow showing the main downstream transfer pipeline and a dashed branch for ImageNet forgetting evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#344054"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .shadow { fill: #eaecf0; opacity: 0.45; }
      .card { fill: #f8fafc; stroke-width: 1.4; rx: 14; ry: 14; }
      .data { fill: #eef6ff; stroke: #7cc3ff; }
      .model { fill: #eefbf3; stroke: #74d39a; }
      .exp { fill: #fff6eb; stroke: #f3b36b; }
      .metric { fill: #f4f3ff; stroke: #b8a9ff; }
      .branch { fill: #fff4f6; stroke: #f29db2; }
      .sub { fill: #ffffff; stroke: #f1c48e; stroke-width: 1; rx: 10; ry: 10; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #101828; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #667085; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #101828; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 12.8px; fill: #344054; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11.2px; fill: #667085; }
      .divider { stroke: #d0d5dd; stroke-width: 1; }
      .arrow { stroke: #344054; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #667085; stroke-width: 1.7; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .lane { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #98a2b3; }
    </style>
  </defs>

  <rect width="1200" height="420" class="bg"/>

  <text x="600" y="34" text-anchor="middle" class="title">Experimental Workflow</text>
  <text x="600" y="56" text-anchor="middle" class="subtitle">Main downstream pipeline on top, with a separate dashed branch for source-task forgetting evaluation</text>

  <text x="40" y="92" class="lane">MAIN TRANSFER PIPELINE</text>
  <text x="620" y="284" class="lane">FORGETTING BRANCH</text>

  <rect x="43" y="108" width="210" height="142" rx="14" ry="14" class="shadow"/>
  <rect x="40" y="104" width="210" height="142" rx="14" ry="14" class="card data"/>
  <text x="145" y="130" text-anchor="middle" class="label">Data Preparation</text>
  <line x1="68" y1="144" x2="222" y2="144" class="divider"/>
  <text x="68" y="170" class="text">EuroSAT main task</text>
  <text x="68" y="193" class="text">CIFAR-10 comparison</text>
  <text x="68" y="216" class="text">EuroSAT data fractions</text>
  <text x="68" y="234" class="small">class-balanced splits, resize, augmentation</text>

  <rect x="293" y="108" width="210" height="142" rx="14" ry="14" class="shadow"/>
  <rect x="290" y="104" width="210" height="142" rx="14" ry="14" class="card model"/>
  <text x="395" y="130" text-anchor="middle" class="label">Model Setup</text>
  <line x1="318" y1="144" x2="472" y2="144" class="divider"/>
  <text x="318" y="170" class="text">ResNet-18 backbone</text>
  <text x="318" y="193" class="text">ImageNet weights or random init</text>
  <text x="318" y="216" class="text">Replace with 10-class head</text>
  <text x="318" y="234" class="small">same loss, different trainable layers</text>

  <rect x="543" y="88" width="280" height="178" rx="14" ry="14" class="shadow"/>
  <rect x="540" y="84" width="280" height="178" rx="14" ry="14" class="card exp"/>
  <text x="680" y="110" text-anchor="middle" class="label">Downstream Experiments</text>
  <line x1="568" y1="124" x2="792" y2="124" class="divider"/>

  <rect x="565" y="138" width="230" height="30" rx="10" ry="10" class="sub"/>
  <text x="680" y="158" text-anchor="middle" class="text">4.1 Strategy ablation: scratch, linear, partial, full</text>

  <rect x="565" y="176" width="230" height="30" rx="10" ry="10" class="sub"/>
  <text x="680" y="196" text-anchor="middle" class="text">4.2 Domain gap: EuroSAT vs CIFAR-10</text>

  <rect x="565" y="214" width="230" height="30" rx="10" ry="10" class="sub"/>
  <text x="680" y="234" text-anchor="middle" class="text">4.3 Data size: 10%, 30%, 60%, 100%</text>

  <rect x="863" y="108" width="290" height="142" rx="14" ry="14" class="shadow"/>
  <rect x="860" y="104" width="290" height="142" rx="14" ry="14" class="card metric"/>
  <text x="1005" y="130" text-anchor="middle" class="label">Downstream Evaluation</text>
  <line x1="888" y1="144" x2="1122" y2="144" class="divider"/>
  <text x="888" y="171" class="text">Test top-1 accuracy</text>
  <text x="888" y="194" class="text">Macro-F1</text>
  <text x="888" y="217" class="text">Transfer gain over scratch</text>
  <text x="888" y="235" class="small">best checkpoint selected by validation top-1</text>

  <path d="M250 175 H290" class="arrow"/>
  <path d="M500 175 H540" class="arrow"/>
  <path d="M820 175 H860" class="arrow"/>

  <rect x="623" y="299" width="220" height="56" rx="14" ry="14" class="shadow"/>
  <rect x="620" y="295" width="220" height="56" rx="14" ry="14" class="card branch"/>
  <text x="730" y="320" text-anchor="middle" class="label">Adapted Checkpoints</text>
  <text x="730" y="341" text-anchor="middle" class="small">take the downstream-trained backbone</text>

  <rect x="903" y="283" width="250" height="88" rx="14" ry="14" class="shadow"/>
  <rect x="900" y="279" width="250" height="88" rx="14" ry="14" class="card branch"/>
  <text x="1025" y="304" text-anchor="middle" class="label">ImageNet Forgetting Test</text>
  <line x1="928" y1="318" x2="1122" y2="318" class="divider"/>
  <text x="928" y="341" class="text">reload backbone into 1000-class model</text>
  <text x="928" y="362" class="small">evaluate on ILSVRC2012 val and compute before - after</text>

  <path d="M680 262 V281" class="dash"/>
  <path d="M840 323 H900" class="dash"/>

  <text x="600" y="396" text-anchor="middle" class="small">Solid arrows show the main downstream workflow; dashed arrows show the additional forgetting evaluation branch.</text>
</svg>
