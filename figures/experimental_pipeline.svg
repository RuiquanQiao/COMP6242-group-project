<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Experimental workflow for the transfer learning study</title>
  <desc id="desc">A paper-style horizontal experimental workflow showing data preparation, model setup, downstream experiments, downstream evaluation, and ImageNet forgetting evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#344054"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #d0d5dd; stroke-width: 1.3; rx: 10; }
      .data { fill: #eff8ff; stroke: #84caff; }
      .model { fill: #f0fdf4; stroke: #86efac; }
      .exp { fill: #fff7ed; stroke: #fdba74; }
      .metric { fill: #f5f3ff; stroke: #c4b5fd; }
      .forget { fill: #fff1f3; stroke: #fda4af; }
      .sub { fill: #ffffff; stroke: #fed7aa; stroke-width: 1; rx: 7; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #101828; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #101828; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; fill: #344054; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; fill: #667085; }
      .line { stroke: #d0d5dd; stroke-width: 1; }
      .arrow { stroke: #344054; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #667085; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="520" class="bg"/>
  <text x="600" y="38" text-anchor="middle" class="title">Experimental Workflow</text>
  <text x="600" y="62" text-anchor="middle" class="small">Downstream transfer experiments followed by source-task forgetting evaluation</text>

  <rect x="40" y="135" width="195" height="215" class="box data"/>
  <text x="137.5" y="164" text-anchor="middle" class="label">Data Preparation</text>
  <line x1="65" y1="183" x2="210" y2="183" class="line"/>
  <text x="70" y="211" class="text">EuroSAT main task</text>
  <text x="70" y="236" class="text">CIFAR-10 comparison</text>
  <text x="70" y="261" class="text">EuroSAT data fractions</text>
  <text x="70" y="296" class="small">class-balanced splits</text>
  <text x="70" y="318" class="small">resize, augmentation</text>
  <text x="70" y="340" class="small">ImageNet normalization</text>

  <rect x="285" y="135" width="195" height="215" class="box model"/>
  <text x="382.5" y="164" text-anchor="middle" class="label">ResNet-18 Setup</text>
  <line x1="310" y1="183" x2="455" y2="183" class="line"/>
  <text x="315" y="211" class="text">ImageNet weights</text>
  <text x="315" y="236" class="text">or random init</text>
  <text x="315" y="271" class="text">10-class head</text>
  <text x="315" y="306" class="small">same training loss</text>
  <text x="315" y="328" class="small">different trainable layers</text>

  <rect x="530" y="82" width="280" height="310" class="box exp"/>
  <text x="670" y="112" text-anchor="middle" class="label">Downstream Experiments</text>
  <line x1="558" y1="132" x2="782" y2="132" class="line"/>

  <rect x="560" y="145" width="220" height="62" class="sub"/>
  <text x="670" y="170" text-anchor="middle" class="label">4.1 Strategy Ablation</text>
  <text x="670" y="193" text-anchor="middle" class="small">scratch, linear, partial, full</text>

  <rect x="560" y="230" width="220" height="62" class="sub"/>
  <text x="670" y="255" text-anchor="middle" class="label">4.2 Domain Gap</text>
  <text x="670" y="278" text-anchor="middle" class="small">EuroSAT vs CIFAR-10</text>

  <rect x="560" y="315" width="220" height="62" class="sub"/>
  <text x="670" y="340" text-anchor="middle" class="label">4.3 Data Size</text>
  <text x="670" y="363" text-anchor="middle" class="small">10%, 30%, 60%, 100%</text>

  <rect x="860" y="135" width="140" height="215" class="box metric"/>
  <text x="930" y="164" text-anchor="middle" class="label">Downstream</text>
  <text x="930" y="184" text-anchor="middle" class="label">Evaluation</text>
  <line x1="883" y1="204" x2="977" y2="204" class="line"/>
  <text x="887" y="234" class="text">Top-1 accuracy</text>
  <text x="887" y="263" class="text">Macro-F1</text>
  <text x="887" y="292" class="text">Transfer gain</text>

  <rect x="1050" y="135" width="125" height="215" class="box forget"/>
  <text x="1112.5" y="164" text-anchor="middle" class="label">ImageNet</text>
  <text x="1112.5" y="184" text-anchor="middle" class="label">Forgetting</text>
  <line x1="1072" y1="204" x2="1153" y2="204" class="line"/>
  <text x="1075" y="234" class="text">reload</text>
  <text x="1075" y="258" class="text">backbone</text>
  <text x="1075" y="292" class="text">before - after</text>
  <text x="1075" y="316" class="small">ImageNet top-1</text>

  <path d="M235 242.5 H285" class="arrow"/>
  <path d="M480 242.5 H530" class="arrow"/>
  <path d="M810 242.5 H860" class="arrow"/>
  <path d="M1000 242.5 H1050" class="dash"/>

  <text x="600" y="448" text-anchor="middle" class="small">The downstream-trained checkpoints are also re-tested on ImageNet to quantify catastrophic forgetting.</text>
  <text x="600" y="471" text-anchor="middle" class="small">Solid arrows indicate downstream transfer evaluation; the dashed arrow indicates source-task forgetting evaluation.</text>
</svg>
