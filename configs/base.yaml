seed: 42
device: "auto"
output_dir: "outputs/resnet18_transfer"

runtime:
  gpu_id: 0

model:
  name: "resnet18"

dataset:
  name: "eurosat"
  root: "data/eurosat/2750"
  metadata_csv: "data/metadata.csv"
  num_classes: 10
  image_size: 224
  num_workers: 4
  download: false
  val_ratio: 0.15
  train_samples: 0
  val_samples: 0
  test_samples: 0

training:
  strategy: "full_ft"
  epochs: 8
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  convergence_threshold: 0.9

evaluation:
  split: "test"
